<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | FoodieExpress</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container navbar-content">
            <a href="index.html" class="logo">FoodieExpress</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="register.html">Create Account</a>
            </div>
        </div>
    </nav>

    <main class="auth-wrapper">
        <section class="auth-card">
            <h1>Welcome Back!</h1>
            <p class="auth-subtitle">Login to your FoodieExpress account</p>

            <div id="loginMessage" class="message"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-block">
                    Login
                </button>
            </form>

            <p class="text-center mt-3">
              <a href="pages/forgot-password.html">Forgot Password?</a>
            </p>

            <p class="text-center mt-3">
                Don't have an account?
                <a href="register.html">Register Now</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 FoodieExpress. All rights reserved.</p>
        </div>
    </footer>

    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>

</body>
</html>

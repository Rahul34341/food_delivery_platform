<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | FoodieExpress</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>

    <nav class="navbar">
        <div class="container navbar-content">
            <a href="../dashboard.html" class="logo">FoodieExpress</a>

            <div class="nav-links">
                <a href="../dashboard.html">Dashboard</a>
                <a href="../profile.html">My Profile</a>
                <a href="restaurant-management.html">My Restaurants</a>
            </div>
        </div>
    </nav>

    <main class="auth-wrapper">
        <section class="auth-card">
            <h1>Change Password</h1>
            <p class="auth-subtitle">
                Keep your FoodieExpress account secure.
            </p>

            <div id="passwordMessage" class="message"></div>

            <form id="changePasswordForm">

                <div class="form-group">
                    <label for="current_password">Current Password</label>
                    <input
                        type="password"
                        id="current_password"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="new_password">New Password</label>
                    <input
                        type="password"
                        id="new_password"
                        minlength="8"
                        maxlength="72"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="confirm_password">Confirm New Password</label>
                    <input
                        type="password"
                        id="confirm_password"
                        minlength="8"
                        maxlength="72"
                        required
                    >
                </div>

                <button type="submit" class="btn btn-block">
                    Update Password
                </button>
            </form>

            <p class="text-center mt-3">
                <a href="../dashboard.html">Back to Dashboard</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 FoodieExpress. All rights reserved.</p>
        </div>
    </footer>

    <script src="../assets/js/config.js"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/change-password.js"></script>

</body>
</html>
